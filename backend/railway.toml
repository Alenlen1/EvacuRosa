# Service Root Directory: repository root (/).
# Set Config File Path to /backend/railway.toml in Railway.
# RAILPACK_INSTALL_CMD=npm ci --workspace=backend --include-workspace-root=false --include=dev
[build]
builder = "RAILPACK"
buildCommand = "npm run build --workspace=backend"

[deploy]
startCommand = "node backend/dist/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
